<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cotizador de Pedidos</title>
</head>

<body>

    <h1>Cotizador de Pedidos</h1>

    <form id="miFormulario">
        <label>Nombre del cliente:</label><br>
        <input type="text" id="cliente"><br><br>

        <label>Precio unitario:</label><br>
        <input type="number" id="precio"><br><br>

        <label>Cantidad:</label><br>
        <input type="number" id="cantidad"><br><br>

        <button type="submit">Calcular</button>
    </form>

    <h2>Resultado</h2>
    <p id="txtSubtotal"></p>
    <p id="txtDescuento"></p>
    <p id="txtTotal"></p>

    <script src="js/ejercicio.js"></script>

</body>

</html>
